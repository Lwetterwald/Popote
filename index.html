<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F3EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Popote">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>Popote – les repas du foyer</title>
<style>
:root{
  --fond:#F7F3EA; --carte:#FFFFFF; --encre:#26251F; --doux:#6B675C; --ligne:#E4DDCD;
  --vert:#4F6B3A; --vert-clair:#E6EEDC; --terre:#B85A33; --terre-clair:#F8E4D9;
  --jaune:#E9B949; --jaune-clair:#FBF0D3; --rouge:#B23A2E;
  --r:14px; --ombre:0 1px 3px rgba(40,35,20,.10),0 4px 14px rgba(40,35,20,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--fond);color:var(--encre)}
body{font:19px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:24px;margin-bottom:12px}
h3{font-size:17px;text-transform:uppercase;letter-spacing:.06em;color:var(--doux);margin:22px 4px 8px}

/* En-tête */
.entete{position:sticky;top:0;z-index:20;background:var(--fond);padding:calc(10px + env(safe-area-inset-top)) 18px 8px;
  display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--ligne)}
.entete h1{font-size:28px;color:var(--vert);font-weight:800;letter-spacing:-.01em}
.entete .sous{color:var(--doux);font-size:16px}
main{max-width:980px;margin:0 auto;padding:14px 14px 30px}

/* Onglets */
.onglets{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#FFFDF8;border-top:1px solid var(--ligne);
  display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.onglets button{flex:1;border:0;background:none;padding:6px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:14px;color:var(--doux);min-height:60px;cursor:pointer}
.onglets button .ico{font-size:25px;line-height:1}
.onglets button.on{color:var(--vert);background:var(--vert-clair);font-weight:700}

/* Boutons */
.btn{border:1.5px solid var(--ligne);background:var(--carte);border-radius:12px;padding:10px 16px;min-height:48px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--vert);border-color:var(--vert);color:#fff}
.btn.terre{background:var(--terre);border-color:var(--terre);color:#fff}
.btn.ic{width:48px;padding:0;font-size:20px}
.btn.del{border-color:transparent;background:transparent;color:var(--doux)}
.btn.large{width:100%;font-size:20px;min-height:56px}
.btn.petit{min-height:40px;padding:6px 12px;font-size:16px}
.btn[disabled]{opacity:.45}
.lien{border:0;background:none;padding:0;color:var(--vert);font-weight:600;text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.actions.fin{justify-content:flex-end;margin-top:20px}
.barre{display:flex;align-items:center;gap:10px}
.barre .titre-sem{flex:1;text-align:center;font-weight:700;font-size:20px}

/* Cartes */
.carte{background:var(--carte);border-radius:var(--r);box-shadow:var(--ombre);padding:16px;margin:12px 0}
.muted{color:var(--doux)} .petit{font-size:16px} .centre{text-align:center}
.lbl{font-weight:700;margin-bottom:8px}
.alerte{background:var(--terre-clair);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:17px}
.info{background:var(--vert-clair);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:17px}

/* Menus */
.jour{background:var(--carte);border-radius:var(--r);box-shadow:var(--ombre);padding:12px;margin:12px 0}
.jour.auj{outline:3px solid var(--vert)}
.jour-tete{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:2px 4px 10px}
.jour-nom{font-weight:800;font-size:20px}
.pastille{background:var(--jaune-clair);border-radius:999px;padding:3px 10px;font-size:15px;font-weight:600}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:620px){.slots{grid-template-columns:1fr}}
.slot{text-align:left;border:1.5px solid var(--ligne);border-radius:12px;background:#FFFEFB;padding:10px 12px;min-height:92px;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;width:100%}
.slot.fait{background:var(--vert-clair);border-color:#C7D6B5}
.slot-tete{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--doux);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.slot-tete .nb{font-weight:600;text-transform:none;letter-spacing:0}
.slot-tete .ok{margin-left:auto;color:var(--vert);text-transform:none;letter-spacing:0}
.slot .vide{color:var(--doux);font-style:italic;padding:6px 0}
.plat{padding:2px 0;font-weight:600}
.plat .cat-entree,.plat .cat-dessert{font-weight:500;color:#4a473f}
.plat .cat-entree::before{content:"Entrée · ";color:var(--doux);font-weight:400}
.plat .cat-dessert::before{content:"Dessert · ";color:var(--doux);font-weight:400}
.pts-ligne{margin-top:6px;font-size:15px;color:var(--doux)}
.pts-ligne b{color:var(--vert)}

/* Badges */
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:15px;font-weight:700;background:var(--vert-clair);color:var(--vert);white-space:nowrap}
.badge.o{background:var(--jaune-clair);color:#8a6510}
.badge.r{background:var(--terre-clair);color:var(--rouge)}
.badge.g{background:#EEEAE0;color:#55524a}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--ligne);background:#fff;border-radius:999px;padding:8px 16px;min-height:44px;cursor:pointer;font-weight:600}
.chip.on{background:var(--vert);border-color:var(--vert);color:#fff}
.defil{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.defil .chip{flex:0 0 auto}

/* Listes */
.rec{display:flex;align-items:center;gap:12px;background:var(--carte);border-radius:12px;box-shadow:var(--ombre);padding:12px 14px;margin:8px 0;cursor:pointer;width:100%;text-align:left;border:0}
.rec .t{flex:1;font-weight:700}
.rec .t small{display:block;font-weight:400;color:var(--doux);font-size:15px;margin-top:2px}
.etoile{color:var(--jaune);font-size:20px}

/* Courses */
.article{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:var(--carte);padding:12px 12px;border-bottom:1px solid var(--ligne);cursor:pointer;min-height:58px}
.groupe{background:var(--carte);border-radius:var(--r);box-shadow:var(--ombre);overflow:hidden}
.groupe .article:last-child{border-bottom:0}
.case{flex:0 0 32px;height:32px;border:2.5px solid var(--vert);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:20px}
.article.coche .case{background:var(--vert)}
.article.coche .art-nom{text-decoration:line-through;color:var(--doux)}
.art-nom{flex:1;font-weight:600}
.art-qte{color:var(--doux);font-size:17px;text-align:right}
.art-x{flex:0 0 auto}
.ligne-dates{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}

/* Formulaires */
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{border:1.5px solid var(--ligne);border-radius:10px;padding:10px 12px;background:#fff;min-height:48px;max-width:100%}
textarea{width:100%;min-height:150px}
input:focus,select:focus,textarea:focus{outline:3px solid #B9CDA5;border-color:var(--vert)}
.champ{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.champ>span{font-weight:600;font-size:17px}
.grille2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grille3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:620px){.grille3{grid-template-columns:1fr 1fr}}
.switch{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:18px;cursor:pointer}
.switch input{width:26px;height:26px;accent-color:var(--vert);flex:0 0 auto}
.ligne{display:flex;align-items:center;gap:10px;margin:10px 0}
.recherche{width:100%;font-size:19px}
.ing-ligne{display:grid;grid-template-columns:1fr 110px 48px;gap:8px;margin:8px 0;align-items:center}
.ing-ligne .u{font-size:15px;color:var(--doux)}

/* Points */
.compteur{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.compteur .gros{font-size:56px;font-weight:800;line-height:1;color:var(--vert)}
.compteur .gros.neg{color:var(--rouge)}
.jauge{height:16px;background:#EEEAE0;border-radius:999px;overflow:hidden;margin:14px 0 6px}
.jauge>div{height:100%;background:var(--vert);border-radius:999px}
.jauge.trop>div{background:var(--terre)}
.ligne-pts{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ligne)}
.ligne-pts:last-child{border-bottom:0}
.ligne-pts .t{flex:1}
.mini{display:grid;grid-template-columns:90px 1fr 70px;gap:10px;align-items:center;margin:6px 0;font-size:16px}
.mini .barre-m{height:12px;background:#EEEAE0;border-radius:999px;overflow:hidden}
.mini .barre-m>div{height:100%;background:var(--vert)}
.mini .barre-m.trop>div{background:var(--terre)}

/* Nutrition */
.nutri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
@media (max-width:620px){.nutri{grid-template-columns:repeat(2,1fr)}}
.nutri div{background:#FAF7F0;border-radius:10px;padding:8px 10px}
.nutri b{display:block;font-size:22px}
.nutri span{font-size:14px;color:var(--doux)}
ol.etapes{padding-left:26px} ol.etapes li{margin:8px 0}
ul.ingr{list-style:none;padding:0;margin:0}
ul.ingr li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--ligne)}
ul.ingr li span:last-child{color:var(--doux);text-align:right}

/* Fenêtre modale */
#voile{position:fixed;inset:0;background:rgba(30,28,20,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
#voile.ouvert{display:flex}
#fenetre{background:var(--fond);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:20px 18px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;position:relative}
@media (min-width:700px){#voile{align-items:center}#fenetre{border-radius:20px;max-height:88vh}}
.fermer-x{position:absolute;top:12px;right:12px}
.sec{background:var(--carte);border-radius:12px;padding:12px 14px;margin:10px 0;box-shadow:var(--ombre)}
.item-menu{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--ligne)}
.item-menu:last-of-type{border-bottom:0}
.item-menu .lien{flex:1}

#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2b2a26;color:#fff;
  padding:12px 20px;border-radius:12px;z-index:80;font-size:17px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.vu{opacity:1}

a.btn{text-decoration:none;color:var(--encre)}
a.btn.pri{color:#fff}
.etapes-notes{padding-left:1.4em;margin:12px 0;font-size:1.05em;line-height:1.45}
.etapes-notes li{margin:0 0 10px}
.ok-notes{font-weight:600;color:var(--vert)}
/* Impression (gros caractères) */
#impression{display:none}
@media print{
  @page{margin:10mm 8mm}
  body{padding:0;background:#fff}
  .entete,.onglets,main,#voile,#toast,#bandeau{display:none!important}
  #impression{display:block;font-size:20pt;line-height:1.35;color:#000}
  #impression h1{font-size:26pt;margin:0 0 6mm}
  #impression h2{font-size:18pt;margin:7mm 0 2mm;text-transform:uppercase;border-bottom:2px solid #000}
  #impression .l{display:flex;gap:5mm;align-items:center;padding:2.5mm 0;border-bottom:1px solid #999;break-inside:avoid}
  #impression .c{width:8mm;height:8mm;border:2px solid #000;flex:0 0 auto}
  #impression .q{margin-left:auto;font-size:17pt}
  #impression .notes{margin-top:8mm}
  #impression .notes div{border-bottom:1px solid #999;height:13mm}
}
/* Champs dans les grilles : ne jamais déborder sur petit écran */
.ing-ligne>*,.grille2>*,.grille3>*{min-width:0}
.ing-ligne input,.ing-ligne select,.grille2 input,.grille2 select,.grille3 input,.champ input,.champ select{width:100%;min-width:0}
html,body{overflow-x:hidden}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@supports (height:100dvh){#fenetre{max-height:92dvh}@media (min-width:700px){#fenetre{max-height:88dvh}}}
/* iPhone en paysage : encoches sur les côtés */
.entete,main{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
.onglets{padding-left:max(4px,env(safe-area-inset-left));padding-right:max(4px,env(safe-area-inset-right))}
.a-faire{color:#9a4a1f!important;font-weight:600}
.rec .t small.a-faire{font-weight:600}
ul.ingr li.ing-t{cursor:pointer;align-items:center;min-height:44px}
ul.ingr li .ing-n{display:flex;align-items:center;gap:10px;color:var(--encre);text-align:left}
ul.ingr li .ing-n > span:not(.case-ing){color:var(--encre);text-align:left}
ul.ingr li > span:last-child{white-space:nowrap}
ul.ingr li .case-ing{flex:0 0 26px;height:26px;border:2.5px solid var(--vert);border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#fff;background:var(--vert)}
ul.ingr li.off .case-ing{background:transparent}
ul.ingr li.off .ing-n > span:last-child{text-decoration:line-through;color:var(--doux)}
.chip.naime{background:var(--terre-clair);border-color:#E8C3B0}
.ac-liste{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 8px}
.sync-ico{margin-left:auto;border:1.5px solid var(--ligne);background:#fff;border-radius:999px;padding:4px 12px;font:inherit;font-size:16px;font-weight:700;color:var(--doux);min-height:36px;cursor:pointer;white-space:nowrap}
.sync-ico[hidden]{display:none}
.sync-ico.ok{color:var(--vert);border-color:#C7D6B5}
.sync-ico.erreur{color:var(--rouge);border-color:#E8B5AE}
.sync-ico.horsligne{color:var(--doux)}
.ac-liste[hidden]{display:none}
.ac-item{border:1.5px solid var(--vert);background:#fff;color:var(--vert);border-radius:999px;padding:8px 14px;min-height:44px;font:inherit;font-size:17px;font-weight:600;cursor:pointer;text-align:left}
.ac-item.ac-tous{background:var(--vert-clair)}
.ac-item.ac-creer{border-style:dashed;border-color:var(--terre);color:var(--terre)}
.ac-plus{width:100%;font-size:15px;color:var(--doux)}
.rec.fete{box-shadow:inset 5px 0 0 #9B5BB0,var(--ombre)}
.badge.fete{background:#F1E4F7;color:#6E3A86}
.fete-info{background:#F6ECFA;border-radius:12px;padding:12px 14px;margin:10px 0;font-size:16px;color:#4d2a5c}
.compteurs{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
.compteurs .gros{font-size:52px;font-weight:800;line-height:1;color:var(--vert)}
.compteurs .gros.res{color:#7A4B96}
.compteurs .gros.neg{color:var(--rouge)}
.cpt-res{border-left:2px solid var(--ligne);padding-left:12px}
.st-ctl{display:flex;align-items:center;gap:10px;margin-left:auto}
.ligne-dates label{display:flex;align-items:center;gap:8px;flex:1 1 170px}
.ligne-dates label input{flex:1;min-width:0}

/* ===== Petit écran (iPhone) ===== */
@media (max-width:480px){
  body{font-size:18px}
  h2{font-size:22px;padding-right:44px}
  .entete h1{font-size:25px}
  .entete .sous{font-size:15px}
  main{padding-top:10px;padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
  .onglets button{font-size:12px;min-height:56px;padding:5px 0;border-radius:10px}
  .onglets button .ico{font-size:23px}
  .carte,.jour{padding:12px}
  .btn{padding:10px 12px}
  .actions{gap:8px}
  .actions .btn{flex:1 1 auto}
  .grille2{grid-template-columns:1fr}
  .titre-sem{font-size:18px}
  .ing-ligne{grid-template-columns:1fr 84px 44px}
  .nutri b{font-size:20px}
  .article.st{flex-wrap:wrap;row-gap:6px}
  .article.st .art-nom{flex:1 1 150px}
  .st-ctl{gap:8px}
  #fenetre{padding:18px 14px calc(22px + env(safe-area-inset-bottom))}
  .rec{padding:12px}
}

/* ===== Scanner de codes-barres ===== */
#scanner{position:fixed;inset:0;z-index:45;background:#151513;color:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#scanner[hidden]{display:none}
.sc-haut{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 16px}
.sc-titre{flex:1;font-weight:800;font-size:20px}
.sc-x{background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
.sc-video{position:relative;flex:0 0 auto;height:min(50vh,460px);background:#000;overflow:hidden}
.sc-video video{width:100%;height:100%;object-fit:cover;display:block}
.sc-cadre{position:absolute;left:7%;right:7%;top:28%;height:44%;border:3px solid rgba(255,255,255,.95);border-radius:16px;box-shadow:0 0 0 3000px rgba(0,0,0,.30);transition:border-color .12s,box-shadow .12s}
.sc-cadre.ok{border-color:#86E05F;box-shadow:0 0 0 3000px rgba(40,120,30,.40)}
.sc-laser{position:absolute;left:5%;right:5%;top:50%;height:2px;background:#FF5A45;opacity:.85}
.sc-msg{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:17px;font-weight:600;padding:0 14px;text-shadow:0 1px 4px #000}
.sc-liste{flex:1;min-height:0;overflow:auto;background:var(--fond);color:var(--encre);padding:4px 12px;-webkit-overflow-scrolling:touch}
.sc-art{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--ligne)}
.sc-art.neuf{background:var(--vert-clair);border-radius:10px}
.sc-n{min-width:34px;font-weight:800;color:var(--vert);font-size:19px}
.sc-t{flex:1;font-weight:700;font-size:17px;min-width:0;overflow-wrap:anywhere}
.sc-t small{display:block;font-weight:400;color:var(--doux);font-size:15px}
.sc-vide{color:var(--doux);text-align:center;padding:14px 8px;font-size:17px}
.sc-bas{display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--fond);color:var(--encre);border-top:1px solid var(--ligne)}
.sc-bas .btn{flex:1;min-height:54px;font-size:18px}

</style>
</head>
<body>
<header class="entete"><h1>Popote</h1><span class="sous" id="sous"></span><button id="sync-ico" class="sync-ico" data-a="syncMaintenant" hidden aria-label="Synchroniser">☁︎</button></header>
<div id="bandeau"></div>
<main id="main"></main>
<nav class="onglets" id="onglets"></nav>
<div id="scanner" hidden></div>
<div id="voile"><div id="fenetre" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>
<div id="impression"></div>
<datalist id="dl-ingr"></datalist>
<datalist id="dl-rec"></datalist>
<script>
/* ===== Base d'aliments =====
   Valeurs pour 100 g (ou 100 ml), aliments crus, ordres de grandeur type table Ciqual (ANSES).
   n = [kcal, protéines g, acides gras saturés g, sucres g, fibres g, cholestérol mg]
   r = rayon ; u = unité d'achat ('g', 'ml', 'pc') ; pc = poids d'une pièce (g) ; ul = nom de l'unité
   z = 1 : fruit ou légume « zéro point » (si l'option est activée) */
const RAYONS = {
  fl: 'Fruits & légumes',
  bv: 'Boucherie – volaille',
  po: 'Poissonnerie',
  cr: 'Crèmerie – œufs',
  bo: 'Boulangerie',
  ep: 'Épicerie',
  pl: 'Placard (à vérifier)',

/* ---------- Proposition automatique de menus ---------- */
const CIBLES = { poisson: 3, volaille: 3, viande: 1, legumineuses: 3, oeufs: 1, vege: 3 }; // pour 14 repas

  const jours = [...Array(7)].map((_, k) => addDays(lundi, k));
  const saison = saisonDe(addDays(lundi, 3));

  const entrees = toutesRecettes().filter(r => r.cat === 'entree' && !estFete(r) && (r.saison.includes('toutes') || r.saison.includes(saison)));
  const desserts = toutesRecettes().filter(r => r.cat === 'dessert' && !estFete(r) && (r.saison.includes('toutes') || r.saison.includes(saison)));

  for (let k = 1; k <= 14; k++) { const d = addDays(lundi, -k); for (const s of ['dej', 'din']) { const m = repas(d, s); if (m) m.items.forEach(x => recentes.add(x)); } }

  for (const d of jours) for (const s of ['dej', 'din']) {
    const m = repas(d, s);
    if (m && m.dehors) continue;
    if (d < auj()) { const pl = m && m.items.map(x => REC[x]).find(r => r && r.cat === 'plat'); if (pl) compte[typeRecette(pl)]++; continue; } // jours passés : on ne touche pas

    if (plat && !opts.remplacer) { compte[typeRecette(plat)]++; m.items.forEach(x => dejaSemaine.add(x)); continue; }
    aRemplir.push([d, s]);
  }
  const nbRepas = aRemplir.length + Object.values(compte).reduce((a, b) => a + b, 0);
  const melange = l => l.map(x => [Math.random(), x]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  const pioche = l => { let file = []; return () => { if (!file.length) file = melange(l); return file.pop(); }; };

    if (!types.length) break;
    types.sort((a, b) => (cible(b) - compte[b] + (PREF[s].includes(b) ? 0.6 : 0)) - (cible(a) - compte[a] + (PREF[s].includes(a) ? 0.6 : 0)));

    if (t === 'viande' && compte.viande >= Math.ceil(cible('viande'))) t = types[1] || t;
    const cands = plats.filter(r => typeRecette(r) === t && !dejaSemaine.has(r.id) && permis(r));

  }

    let premier = true;
    for (const it of its) {
      const q = pdfOctets(qteArticle(it));
      let ql = q.length ? [q] : [], qw = q.length ? pdfLarg(q, false, TQ) : 0;
      const maxQ = (X1 - XN) * 0.45;
      if (qw > maxQ) { ql = pdfCouper(q, false, TQ, maxQ); qw = Math.max(...ql.map(l => pdfLarg(l, false, TQ))); }
      const nl = pdfCouper(pdfOctets(nomArticle(it)), false, TN, X1 - XN - (qw ? qw + 14 : 0));
      const hRang = PAD * 2 + Math.max(LN, nl.length * LN, ql.length * LQ);
      const besoin = hRang + (premier ? H_TETE : 0);
      if (y - besoin < BAS) { page(); tete(RAYONS[r] + (premier ? '' : ' (suite)')); }
      else if (premier) tete(RAYONS[r]);
      premier = false;
      const b1 = y - PAD - (LN - 0.925 * TN) / 2 - 0.718 * TN, centre = y - PAD - LN / 2;
      ops.push(`0 G 2 w ${pdfN(M + 1)} ${pdfN(centre - CASE / 2 + 1)} ${pdfN(CASE - 2)} ${pdfN(CASE - 2)} re S`);
      nl.forEach((l, k) => texte(l, XN, b1 - k * LN, TN, false));
      ql.forEach((l, k) => texte(l, X1 - pdfLarg(l, false, TQ), b1 - k * LQ, TQ, false));
      y -= hRang; trait(y, 1, true);
    }
  }
  // Lignes pour les notes, seulement s'il reste de la place (jamais de page vide)
  const nbNotes = Math.min(5, Math.floor((y - H_TETE - BAS) / 36.85));
  if (nbNotes >= 2) { tete('Notes'); for (let k = 0; k < nbNotes; k++) { y -= 36.85; trait(y, 1, true); } }
  if (pages.length > 1) pages.forEach((p, i) => {
    const o = pdfOctets('Liste de courses – page ' + (i + 1) + ' / ' + pages.length);
    p.push(`0.35 g BT /F1 10 Tf ${pdfN(X1 - pdfLarg(o, false, 10))} 18 Td ${pdfChaine(o)} Tj ET 0 g`);
  });
  return pdfAssembler(pages, 'Liste de courses');
}

/* Semaine du lundi au dimanche, règle Weight Watchers : chaque jour a son budget ;
   ce qui dépasse est pris sur la réserve de la semaine (par défaut, l'équivalent d'une journée). */
function semainePoints(p, d) {
  const lun = lundiDe(d), jours = [], bonus = p.bonus === undefined ? p.budget : p.bonus;
  let total = 0, puise = 0, prevu = 0;
  for (let k = 0; k < 7; k++) {
    const dd = addDays(lun, k), b = bilanJour(p, dd), dep = Math.max(0, b.pts - p.budget);
    total += b.pts; puise += dep; if (dd > auj()) prevu += dep;
    jours.push({ d: dd, pts: b.pts, dep });
  }
  return { lun, jours, total, puise, prevu, bonus, reste: bonus - puise, max: p.budget * 7 + bonus };
}
function bilanJour(p, d) {
  const t = { pts: 0, ags: 0, chol: 0, kcal: 0 };
  for (const s of ['dej', 'din']) { const x = ptsRepasPersonne(d, s, p); if (x) { t.pts += x.pts; t.ags += x.ags; t.chol += x.chol; t.kcal += x.kcal; } }
  for (const e of ((S.extras[d] || {})[p.id]) || []) { t.pts += e.pts; t.ags += e.ags || 0; t.chol += e.chol || 0; t.kcal += e.kcal || 0; }
  return t;
}

    <div class="info" id="ex-apercu">${apercuExtra()}</div>

function calculExtra() {
  const x = UI.extra; const p = personne(UI.ppers);
  if (x.mode === 'aliment') {
    const a = alimentParNom(x.nom); if (!a || !(x.g > 0)) return null;
    const n = nutrListe([[a.id, x.g]]);
    return { label: `${a.nom} ${nb(x.g)} ${a.u === 'ml' ? 'ml' : 'g'}`, pts: Math.round(n.pts), ags: n.ags, chol: n.chol, kcal: n.kcal };
  }
  if (x.mode === 'recette') {
    const r = recetteParNom(x.rec); if (!r) return null;
    const n = nutrRecette(r);
    return { label: `${r.nom}${x.coef !== 1 ? ' × ' + nb(x.coef, 2) : ''}`, pts: ptsPour(n.pts, x.coef), ags: n.ags * x.coef, chol: n.chol * x.coef, kcal: n.kcal * x.coef };
  }
  if (!x.label || !(x.pts >= 0) || x.pts === '') return null;
  return { label: x.label, pts: Math.round(x.pts), ags: 0, chol: 0, kcal: 0 };
}

/* ===== Vue Foyer ===== */
function vueFoyer() {
  let h = `<h3>Les personnes</h3>`;
  for (const p of S.personnes) {
    h += `<div class="carte"><div class="grille2"><label class="champ"><span>Prénom</span><input type="text" data-c="pe-nom" data-p="${p.id}" value="${esc(p.nom)}"></label>
      <label class="champ"><span>Taille de portion</span><select data-c="pe-coef" data-p="${p.id}">${[0.6, 0.7, 0.8, 0.9, 1, 1.1, 1.2, 1.3, 1.4, 1.5, 1.6].map(v => `<option value="${v}" ${Math.abs(p.coef - v) < 0.01 ? 'selected' : ''}>× ${nb(v, 1)}${v === 1 ? ' (normale)' : v < 1 ? ' (petite)' : ' (grande)'}</option>`).join('')}</select></label></div>
      <label class="switch"><input type="checkbox" data-c="pe-defaut" data-p="${p.id}" ${p.presentDefaut ? 'checked' : ''}> Présent(e) tous les jours</label>
      <label class="switch"><input type="checkbox" data-c="pe-suivi" data-p="${p.id}" ${p.suivi ? 'checked' : ''}> Compter ses points</label>
      ${p.suivi ? `<div class="grille2"><label class="champ"><span>Points par jour</span><input type="number" min="0" inputmode="numeric" data-c="pe-budget" data-p="${p.id}" value="${p.budget}"></label>
      <label class="champ"><span>Réserve par semaine (points)</span><input type="number" min="0" inputmode="numeric" data-c="pe-bonus" data-p="${p.id}" value="${p.bonus === undefined ? p.budget : p.bonus}"></label>
      <label class="champ"><span>Repère graisses saturées (g/jour)</span><input type="number" min="0" inputmode="numeric" data-c="pe-ags" data-p="${p.id}" value="${p.agsMax}"></label></div>` : ''}
      <div class="champ"><span>N’aime pas</span>
        ${(p.naime || []).length ? `<div class="chips">${p.naime.map(id => `<button class="chip naime" data-a="retirerNaime" data-p="${p.id}" data-i="${esc(id)}">${esc(ING[id] ? ING[id].nom : id)} ✕</button>`).join('')}</div>` : '<span class="muted petit">Rien pour l’instant.</span>'}
        <input type="text" data-ac="ing" data-ac-tous="1" data-c="pe-naime" data-i="pe-naime" data-p="${p.id}" placeholder="＋ Ajouter un aliment (ex. : fenouil)" autocomplete="off"></div>
      ${S.personnes.length > 1 ? `<div class="actions fin" style="margin-top:4px"><button class="btn del petit" data-a="supprPersonne" data-p="${p.id}">Retirer cette personne</button></div>` : ''}</div>`;
  }
  h += `<div class="actions"><button class="btn" data-a="ajoutPersonne">＋ Ajouter une personne</button></div>`;
  const nonDefaut = S.personnes.filter(p => !p.presentDefaut);
  h += `<h3>Séjours des enfants</h3><div class="carte">`;
  if (!nonDefaut.length) h += '<p class="muted">Toutes les personnes sont présentes tous les jours.</p>';
  else {
    h += `<div class="champ"><span>Qui vient ?</span><div class="chips">${nonDefaut.map(p => `<button class="chip ${(UI.sejQui || []).includes(p.id) ? 'on' : ''}" data-a="sejQui" data-p="${p.id}">${esc(p.nom)}</button>`).join('')}</div></div>
      <div class="ligne-dates"><label>du <input type="date" id="sej-du" value="${UI.sejDu || auj()}"></label><label>au <input type="date" id="sej-au" value="${UI.sejAu || addDays(auj(), 3)}"></label></div>
      <button class="btn pri" data-a="ajoutSejour">Ajouter le séjour</button>`;
    const avenir = S.sejours.filter(s => s.au >= auj()).sort((a, b) => a.du < b.du ? -1 : 1);
    if (avenir.length) h += `<div style="margin-top:14px">${avenir.map(s => `<div class="ligne-pts"><span class="t"><b>${esc(personne(s.pid) ? personne(s.pid).nom : '?')}</b> · du ${fmtDate(s.du, { weekday: 'short', day: 'numeric', month: 'short' })} au ${fmtDate(s.au, { weekday: 'short', day: 'numeric', month: 'short' })}</span><button class="btn ic del" data-a="supprSejour" data-id="${s.id}">✕</button></div>`).join('')}</div>`;
  }
  h += `</div>`;
  h += `<h3>Réglages</h3><div class="carte">
    <label class="switch"><input type="checkbox" data-c="opt-zero" ${S.options.zeroFL ? 'checked' : ''}> Fruits et légumes frais à 0 point (comme Weight Watchers)</label></div>`;
  h += `<h3>Synchronisation automatique</h3><div class="carte">${blocSync()}</div>`;
  h += `<h3>Sauvegarde et envoi par fichier</h3><div class="carte">
    <p>${syncCfg() ? 'La synchronisation automatique est active : ce qui suit sert surtout de sauvegarde.' : 'Sans synchronisation automatique, chaque appareil (iPad, iPhone) garde ses propres données.'} Pour transmettre toutes les données à l’autre appareil :</p>
    <ol class="etapes"><li>Touchez « Envoyer toutes les données » et choisissez AirDrop, Messages ou Mail.</li><li>Sur son appareil, enregistrez le fichier dans Fichiers.</li><li>Dans son application : Foyer › « Recevoir des données » et choisissez le fichier.</li></ol>
    <div class="actions"><button class="btn pri" data-a="exporter">📤 Envoyer toutes les données</button><button class="btn" data-a="importer">📥 Recevoir des données</button></div>
    <p class="muted petit">Pour la liste de courses seule, utilisez « Envoyer la liste » dans l’onglet Courses.${S.derniereSauvegarde ? ' Dernier envoi : ' + new Date(S.derniereSauvegarde).toLocaleDateString('fr-FR') + '.' : ''} Ce fichier sert aussi de sauvegarde : gardez-en un dans Fichiers de temps en temps.</p>
    <input type="file" id="fichier-import" accept=".json,application/json" style="display:none"></div>`;
  h += `<h3>À propos des calculs</h3><div class="carte petit">
    <p><b>Points</b> : estimation avec la formule publique proche des « SmartPoints » de Weight Watchers (calories × 0,0305 + graisses saturées × 0,275 + sucres × 0,12 − protéines × 0,098), sur le total de la recette. Ce ne sont pas les points officiels de l’application WW, mais ils permettent de comparer les repas et de tenir un budget quotidien.</p>
    <p><b>Valeurs nutritionnelles</b> : ordres de grandeur pour 100 g d’aliment cru, du type de la table Ciqual de l’ANSES. Vous pouvez créer vos propres aliments avec les valeurs de l’étiquette.</p>
    <p><b>Cholestérol</b> : le repère par défaut des graisses saturées correspond à environ 7 % des calories de la journée, valeur souvent conseillée en cas de cholestérol élevé. Ajustez-le avec votre médecin. Pastilles : vert ≤ 3 g par portion, orange ≤ 5 g, rouge au-delà.</p>
    <p><b>Synchronisation</b> : les données partagées sont dans un fichier d’un dépôt GitHub privé. Si les deux appareils changent quelque chose en même temps, les modifications des deux côtés sont fusionnées ; si la même information a été changée des deux côtés, la plus récente l’emporte. Chaque mise à jour reste dans l’historique du dépôt.</p>
    <p><b>Points de la semaine</b> : chaque personne a un budget par jour et une réserve par semaine (par défaut l’équivalent d’une journée), comme chez Weight Watchers. Les dépassements d’une journée sont pris sur la réserve, qui repart à neuf chaque lundi.</p>
    <p><b>Recettes de réception (🎉)</b> : plus riches, pour recevoir sans régime. Elles ne sont jamais proposées automatiquement ; on les choisit soi-même.</p>
    <p><b>Goûts</b> : les recettes qui contiennent un aliment qu’une personne à table n’aime pas ne sont pas proposées automatiquement ; vous pouvez retirer un aliment d’une recette en touchant son nom dans la fiche de la recette.</p>
    <p><b>Codes-barres</b> : les informations sur les produits viennent d’Open Food Facts, base de données libre et collaborative. L’aliment correspondant est proposé automatiquement ; vos corrections sont retenues et un produit déjà rangé est reconnu ensuite sans connexion. Les produits pesés en magasin (étiquette de balance) demandent le poids à chaque fois.</p>
    <p class="muted">Popote version ${VERSION}</p></div>`;
  return h;
}

/* ---------- Listes de suggestions (datalist) ---------- */
function majDatalists() {
  $('#dl-ingr').innerHTML = tousAliments().map(i => `<option value="${esc(i.nom)}"></option>`).join('');
  $('#dl-rec').innerHTML = toutesRecettes().sort((a, b) => a.nom.localeCompare(b.nom, 'fr')).map(r => `<option value="${esc(r.nom)}"></option>`).join('');
}

/* ---------- Actions (clics) ---------- */
const A = {
  onglet: el => { UI.onglet = el.dataset.o; rendre(); window.scrollTo(0, 0); },
  fermer: () => fermer(),
  confirmerOK: () => { const f = UI.confirmAction; UI.confirmAction = null; UI.pile.pop(); dessinerModale(); if (f && f() === 'tout') { UI.pile = []; dessinerModale(); } rendre(); },
  // Menus
  sem: el => { UI.semaine = addDays(UI.semaine, +el.dataset.v); rendre(); },
  semAuj: () => { UI.semaine = lundiDe(auj()); rendre(); },
  ouvrirSlot: el => { UI.slot = { d: el.dataset.d, s: el.dataset.s }; ouvrir(modaleSlot); },
  presence: el => {
    const { d, s } = UI.slot, m = repas(d, s, true), p = personne(el.dataset.p);
    const estLa = presentsRepas(d, s).some(x => x.id === p.id);
    m.absents = m.absents.filter(x => x !== p.id); m.ajoutes = m.ajoutes.filter(x => x !== p.id);
    if (estLa) { if (estPresent(p, d)) m.absents.push(p.id); } else if (!estPresent(p, d)) m.ajoutes.push(p.id);
    sauver(); rafraichirModale();
  },
  invites: el => { const m = repas(UI.slot.d, UI.slot.s, true); m.invites = Math.max(0, m.invites + +el.dataset.v); sauver(); rafraichirModale(); },
  retirerItem: el => { const m = repas(UI.slot.d, UI.slot.s, true); m.items.splice(+el.dataset.i, 1); sauver(); rafraichirModale(); },
  choisir: el => { UI.choixCat = el.dataset.cat; UI.choixQ = ''; ouvrir(modaleChoix); },
  choixCat: el => { UI.choixCat = el.dataset.cat; rafraichirModale(); },
  prendre: el => { const m = repas(UI.slot.d, UI.slot.s, true); m.items.push(el.dataset.r); m.dehors = false; sauver(); UI.pile.pop(); dessinerModale(); },
  viderSlot: () => { const { d, s } = UI.slot; const m = repas(d, s, true); if (m.cuisine) restaurerStock(d, s); delete S.repas[d][s]; sauver(); fermer(); },
  proposer: () => ouvrir(modaleProposer),
  lancerProposition: () => {
    const opts = { remplacer: $('#pr-remplacer').checked, entree: $('#pr-entree').checked, dessert: $('#pr-dessert').checked };
    S.options.entreeSoir = opts.entree; S.options.dessertMidi = opts.dessert;
    const n = proposerSemaine(UI.semaine, opts); sauver(); fermerTout();
    toast(n ? `${n} repas proposés. Touchez un repas pour le changer.` : 'Tous les repas étaient déjà choisis.');
  },
  listeSemaine: () => { const du = UI.semaine < auj() && auj() <= addDays(UI.semaine, 6) ? auj() : UI.semaine; genererListe(du, addDays(UI.semaine, 6)); sauver(); UI.onglet = 'courses'; rendre(); window.scrollTo(0, 0); toast('Liste calculée.'); },
  // Recettes
  rfiltre: el => { UI.rfiltre = el.dataset.f; rendre(); },
  voirRecette: el => { UI.recette = el.dataset.r; UI.portions = Math.max(1, Math.round(S.personnes.filter(p => p.presentDefaut).length)); ouvrir(modaleRecette); },
  portions: el => { UI.portions = Math.max(1, Math.min(20, UI.portions + +el.dataset.v)); rafraichirModale(); },
  favori: () => { const id = UI.recette; S.favoris = S.favoris.includes(id) ? S.favoris.filter(x => x !== id) : [...S.favoris, id]; sauver(); rafraichirModale(); },
  ajouterAuMenu: () => { UI.amDate = auj(); UI.amSlot = REC[UI.recette].cat === 'dessert' ? 'dej' : 'din'; ouvrir(modaleAuMenu); },
  amSlot: el => { UI.amDate = $('#am-date').value || UI.amDate; UI.amSlot = el.dataset.s; rafraichirModale(); },
  validerAuMenu: () => {
    const d = $('#am-date').value; if (!d) return toast('Choisissez un jour.');
    const m = repas(d, UI.amSlot || 'dej', true); m.items.push(UI.recette); m.dehors = false; sauver();
    UI.pile.pop(); dessinerModale(); toast('Ajouté au menu du ' + fmtDate(d, { weekday: 'long', day: 'numeric' }) + (UI.amSlot === 'din' ? ' soir' : ' midi') + '.');
  },
  avecStock: () => ouvrir(modaleAvecStock),
  nouvelleRecette: () => { UI.edit = nouvelleRecetteVide(); UI.edit.i = [['', 0]]; ouvrir(modaleEditeur); },
  copierRecette: () => { const r = REC[UI.recette]; UI.edit = JSON.parse(JSON.stringify(r)); UI.edit.i = JSON.parse(JSON.stringify(ingRecette(r))); UI.edit.id = 'rp_' + uid(); UI.edit.nom = r.nom + ' (ma version)'; UI.edit.perso = true; ouvrir(modaleEditeur); },
  modifierRecette: () => { UI.edit = JSON.parse(JSON.stringify(REC[UI.recette])); ouvrir(modaleEditeur); },
  supprimerRecette: () => confirmer('Supprimer définitivement la recette « ' + esc(REC[UI.recette].nom) + ' » ?', 'Supprimer', () => {
    const id = UI.recette; S.recettesPerso = S.recettesPerso.filter(r => r.id !== id); S.favoris = S.favoris.filter(x => x !== id); delete S.retraits[id];
    for (const d in S.repas) for (const s in S.repas[d]) S.repas[d][s].items = S.repas[d][s].items.filter(x => x !== id);
    reindexer(); majDatalists(); sauver(); UI.pile = []; dessinerModale();
  }, true),
  edTag: el => { const t = el.dataset.t, r = UI.edit; r.tags = r.tags.includes(t) ? r.tags.filter(x => x !== t) : [...r.tags, t]; rafraichirModale(); },
  edSaison: el => {
    const t = el.dataset.t, r = UI.edit;
    if (t === 'toutes') r.saison = ['toutes'];
    else { r.saison = r.saison.filter(x => x !== 'toutes'); r.saison = r.saison.includes(t) ? r.saison.filter(x => x !== t) : [...r.saison, t]; if (!r.saison.length) r.saison = ['toutes']; }
    rafraichirModale();
  },
  edAjouterIng: () => { UI.edit.i.push(['', 0]); rafraichirModale(); },
  edRetirerIng: el => { UI.edit.i.splice(+el.dataset.k, 1); rafraichirModale(); },
  edEnregistrer: () => {
    const r = UI.edit;
    r.i = r.i.filter(([id, g]) => id && g > 0);
    if (!r.nom.trim()) { rafraichirModale(); return toast('Donnez un nom à la recette.'); }
    const inconnus = r.i.filter(([id]) => !ING[id]);
    if (inconnus.length) { rafraichirModale(); return toast('Créez d’abord les aliments inconnus (en orange).'); }
    if (!r.i.length) { r.i.push(['', 0]); rafraichirModale(); return toast('Ajoutez au moins un ingrédient avec son poids.'); }
    r.nom = r.nom.trim(); r.perso = true;
    const k = S.recettesPerso.findIndex(x => x.id === r.id);
    if (k >= 0) S.recettesPerso[k] = r; else S.recettesPerso.push(r);
    reindexer(); majDatalists(); sauver();
    UI.recette = r.id; UI.pile = []; UI.portions = 2; ouvrir(modaleRecette); toast('Recette enregistrée.');
  },
  nouvelAliment: el => { UI.aliment = { nom: el.dataset.nom || '', r: 'fl', u: 'g', pc: 100, n: [0, 0, 0, 0, 0, 0], z: false }; ouvrir(modaleAliment); },
  alEnregistrer: () => {
    const a = UI.aliment;
    if (!a.nom.trim()) return toast('Donnez un nom à l’aliment.');
    const nn = norm(a.nom); if (Object.values(ING).some(i => norm(i.nom) === nn || sing(norm(i.nom)) === sing(nn))) return toast('Cet aliment existe déjà.');
    const nouv = { id: 'ip_' + uid(), nom: a.nom.trim(), r: a.r, n: a.n.map(Number), u: a.u };
    if (a.u === 'pc') nouv.pc = Number(a.pc) || 100;
    if (a.z) nouv.z = 1;
    S.ingrPerso.push(nouv); reindexer(); majDatalists(); sauver();
    if (UI.edit) UI.edit.i = UI.edit.i.map(([id, g]) => [String(id).toLowerCase() === nouv.nom.toLowerCase() ? nouv.id : id, g]);
    UI.pile.pop(); dessinerModale(); toast('Aliment ajouté : ' + nouv.nom + '.');
    if (UI.acSel) { // remettre le nouvel aliment dans la case d'où il a été créé
      const t = document.querySelector(UI.acSel); UI.acSel = null;
      if (t) { t.value = nouv.nom; t._acChoisi = nouv.nom; t.dispatchEvent(new Event('input', { bubbles: true })); t.dispatchEvent(new Event('change', { bubbles: true })); }
    }
  },
  // Courses
  genererListe: () => {
    const du = $('#c-du').value, au = $('#c-au').value;
    if (!du || !au || au < du) return toast('Vérifiez les dates.');
    genererListe(du, au); sauver(); rendre();
    toast(S.courses.items.filter(x => !x.manuel).length ? 'Liste calculée.' : 'Aucun repas prévu sur cette période (ou tout est en stock).');
  },
  cocher: (el, ev) => { if (ev.target.closest('.art-x')) return; const it = S.courses.items.find(x => x.id === el.dataset.id); if (it) { it.coche = !it.coche; sauver(); rendre(); } },
  retirerArticle: el => { S.courses.items = S.courses.items.filter(x => x.id !== el.dataset.id); sauver(); rendre(); },
  ajouterArticle: () => {
    const nom = $('#m-nom').value.trim(); if (!nom) return toast('Écrivez le nom de l’article.');
    const a = alimentParNom(nom); const txt = $('#m-qte').value.trim();
    S.courses.items.push({ id: uid(), ing: a ? a.id : null, nom: a ? a.nom : nom, txt, g: 0, r: a ? a.r : $('#m-r').value, coche: false, manuel: true });
    sauver(); rendre(); toast('Ajouté.');
  },
  effacerCoches: () => { S.courses.items = S.courses.items.filter(x => !x.coche); sauver(); rendre(); },
  viderListe: () => confirmer('Effacer toute la liste de courses ?', 'Tout effacer', () => { S.courses.items = []; S.courses.deja = []; sauver(); }, true),
  rangerCoches: () => {
    const coches = S.courses.items.filter(x => x.coche);
    if (!coches.length) return toast('Cochez d’abord les articles achetés.');
    let n = 0;
    for (const it of coches) {
      if (!it.ing || !ING[it.ing] || it.manuel) continue;
      const i = ING[it.ing]; let g = it.g;
      if (i.u === 'pc') g = Math.max(1, Math.ceil(it.g / i.pc - 0.2)) * i.pc;
      else g = it.g < 100 ? Math.ceil(it.g / 5) * 5 : Math.ceil(it.g / 10) * 10;
      ajouterAuStock(it.ing, g, lieuParDefaut(it.ing), null); n++;
    }
    S.courses.items = S.courses.items.filter(x => !x.coche); sauver(); rendre();
    toast(n + ' article' + (n > 1 ? 's rangés' : ' rangé') + ' dans le stock.');
  },
  partagerListe: async () => {
    const t = texteListe();
    try { if (navigator.share) { await navigator.share({ title: 'Liste de courses', text: t }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(t); toast('Liste copiée : collez-la dans Messages ou Notes.'); return; } catch (e) { }
    ouvrir(() => `<h2>Liste de courses</h2><p class="muted petit">Sélectionnez le texte et copiez-le.</p><textarea style="min-height:50vh">${esc(t)}</textarea>`);
  },
  versNotes: async () => {
    const t = texteNotes();
    if (!t) return toast('Tout est coché : rien à copier.');
    UI.notes = { copie: false, t };
    try { await navigator.clipboard.writeText(t); UI.notes.copie = true; } catch (e) { }
    ouvrir(modaleNotes);
  },
  copierNotes: async () => {
    const ta = $('#txt-notes');
    try { await navigator.clipboard.writeText(UI.notes.t); UI.notes.copie = true; dessinerModale(); return; } catch (e) { }
    try { ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length); if (document.execCommand('copy')) { UI.notes.copie = true; dessinerModale(); return; } } catch (e) { }
    toast('Copie impossible : sélectionnez le texte et copiez-le.');
  },
  imprimerListe: async () => {
    if (!articlesParRayon(true).length) return toast('Tout est coché : rien à imprimer.');
    if (estMobile()) {
      // iPhone / iPad : PDF envoyé à la feuille de partage (choisir « Imprimer »)
      let f = null;
      try { f = new File([pdfListe()], 'Liste de courses.pdf', { type: 'application/pdf' }); } catch (e) { }
      if (f && navigator.canShare && navigator.canShare({ files: [f] })) {
        try { await navigator.share({ files: [f] }); return; }
        catch (e) { if (e && e.name === 'AbortError') return; }
      }
    }
    if (APERCU) return toast(MSG_APERCU);
    const c = S.courses;
    let h = `<h1>Liste de courses${c.du ? ' – du ' + fmtDate(c.du, { day: 'numeric', month: 'long' }) + ' au ' + fmtDate(c.au, { day: 'numeric', month: 'long' }) : ''}</h1>`;
    for (const [r, its] of articlesParRayon(true)) h += `<h2>${RAYONS[r]}</h2>` + its.map(it => `<div class="l"><span class="c"></span><span>${esc(nomArticle(it))}</span><span class="q">${esc(qteArticle(it))}</span></div>`).join('');
    h += `<div class="notes"><h2>Notes</h2>${'<div></div>'.repeat(5)}</div>`;
    $('#impression').innerHTML = h;
    try { window.print(); } catch (e) { toast('Impression impossible ici.'); }
  },
  // Stock
  ajoutStock: () => { UI.stockEdit = { id: null, ing: null, nom: '', q: '', lieu: 'frigo', dlc: '', lieuChoisi: false }; ouvrir(modaleStock); },
  editStock: el => {
    const s = S.stock.find(x => x.id === el.dataset.id), i = ING[s.ing];
    const q = i ? (i.u === 'pc' ? Math.round(s.g / i.pc * 10) / 10 : Math.round(s.g)) : (parseFloat(s.txt) || '');
    UI.stockEdit = { id: s.id, ing: s.ing, nom: s.nom || '', q, lieu: s.lieu, dlc: s.dlc || '', lieuChoisi: true }; ouvrir(modaleStock);
  },
  stockPlus: el => {
    const s = S.stock.find(x => x.id === el.dataset.id); const i = ING[s.ing]; if (!i) return;
    s.g = Math.max(0, s.g + (+el.dataset.v) * i.pc);
    if (s.g <= 0.5) S.stock = S.stock.filter(x => x.id !== s.id);
    sauver(); rendre();
  },
  supprStock: () => { S.stock = S.stock.filter(x => x.id !== UI.stockEdit.id); sauver(); fermer(); },
  validerStock: () => {
    const e = UI.stockEdit, i = ING[e.ing];

/* Recherche dans Open Food Facts (base libre et collaborative). null = pas de réseau. */
async function chercherProduit(code) {
  if (navigator.onLine === false) return null;
  try {
    const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 10000);
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=${OFF_CHAMPS}&lc=fr`, { signal: ctrl.signal });
    clearTimeout(t);
    let j = null; try { j = await r.json(); } catch (e) { }
    if (!j) return r.status === 404 ? { trouve: false } : null;
    if (j.status !== 1 || !j.product) return { trouve: false };
    return { trouve: true, p: j.product };
  } catch (e) { return null; }
}
function contenuPaquet(p) { // contenu total d'un paquet, en g ou ml
  const s = norm(p.quantity || '').replace(/,/g, '.');
  const F = { kg: 1000, gr: 1, g: 1, mg: 0.001, l: 1000, cl: 10, dl: 100, ml: 1 };
  const u = x => /l$/.test(x) ? 'ml' : 'g';
  let m = s.match(/(\d+)\s*[x×*]\s*(\d+(?:\.\d+)?)\s*(kg|gr|g|mg|cl|dl|ml|l)\b/);
  if (m) return { g: +m[1] * +m[2] * F[m[3]], u: u(m[3]) };
  m = s.match(/(\d+(?:\.\d+)?)\s*(kg|gr|g|mg|cl|dl|ml|l)\s*[x×*]\s*(\d+)\b/);
  if (m) return { g: +m[1] * +m[3] * F[m[2]], u: u(m[2]) };
  const pq = parseFloat(p.product_quantity);
  if (pq > 0) return { g: pq, u: p.product_quantity_unit === 'ml' ? 'ml' : 'g' };
  m = s.match(/(\d+(?:\.\d+)?)\s*(kg|gr|g|mg|cl|dl|ml|l)\b/);
  if (m) return { g: +m[1] * F[m[2]], u: u(m[2]) };
  return { g: 0, u: 'g' };
}
function nbPieces(qte, g) { // nombre d'œufs d'une boîte
  const s = norm(qte);
  let m = s.match(/(\d+)\s*(oeufs?|pieces?|unites?|gros|moyens)\b/) || s.match(/^x?\s*(\d+)\s*$/) || s.match(/^(\d+)\s*x\b/);
  if (m && +m[1] > 0 && +m[1] <= 60) return +m[1];
  return g > 0 ? Math.max(1, Math.round(g / 58)) : 6;
}

function devinerAliment(texte, cats) {
  let t = ' ' + norm(texte).replace(/[’'`]/g, ' ').replace(/[^a-z0-9% ]/g, ' ').replace(/\s+/g, ' ') + ' ';
  t = t.replace(/sans sucres? ajoutes?|sans sucre/g, ' ');
  if (/wines|:vins/.test(cats) || /\bvin\b/.test(t)) {
    if (/white-wines|\bblanc\b/.test(cats + t)) return 'vinblanc';
    if (/red-wines|\brouge\b/.test(cats + t)) return 'vinrouge';
    return null;
  }
  for (const [re, id] of R_FORTES) if (re.test(t)) return id;
  if (R_EXCLUS.test(t) || R_EXCLUS_CAT.test(cats)) return null;
  for (const [re, id] of R_ALIM) if (re.test(t)) return id;

/* ---------- Synchronisation automatique entre appareils (dépôt GitHub privé) ----------
   Les données partagées sont dans un fichier JSON d'un dépôt privé. Chaque appareil garde

   qui a changé quoi, et on fusionne les modifications des deux côtés sans rien perdre. */

/* Fusion à trois voies */
const canon = v => JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x) ? Object.keys(x).sort().reduce((o, k2) => (o[k2] = x[k2], o), {}) : x);

const avecIds = l => l.every(x => estObj(x) && typeof x.id === 'string');
function fusion3(b, l, r, prefL) {
  if (l === undefined && r === undefined) return undefined;
  if (l === undefined) return b === undefined ? r : egal(b, r) ? undefined : r;   // ajouté en ligne / supprimé ici
  if (r === undefined) return b === undefined ? l : egal(b, l) ? undefined : l;   // ajouté ici / supprimé en ligne
  if (egal(l, r)) return l;
  if (b !== undefined && egal(b, l)) return r;                                     // seul l'autre appareil a changé
  if (b !== undefined && egal(b, r)) return l;                                     // seul cet appareil a changé
  if (estObj(l) && estObj(r)) {                                                    // les deux ont changé : clé par clé
    const bo = estObj(b) ? b : {}, out = {};
    for (const k of new Set([...Object.keys(l), ...Object.keys(r)])) { const v = fusion3(bo[k], l[k], r[k], prefL); if (v !== undefined) out[k] = v; }
    return out;
  }
  if (Array.isArray(l) && Array.isArray(r)) {
    if (avecIds(l) && avecIds(r)) {                                                // listes d'éléments identifiés : élément par élément
      const bm = new Map((Array.isArray(b) ? b : []).filter(estObj).map(x => [x.id, x])), lm = new Map(l.map(x => [x.id, x])), rm = new Map(r.map(x => [x.id, x]));
      const out = [];
      for (const id of [...lm.keys(), ...[...rm.keys()].filter(i => !lm.has(i))]) { const v = fusion3(bm.get(id), lm.get(id), rm.get(id), prefL); if (v !== undefined) out.push(v); }
      return out;
    }
    if ([...l, ...r].every(x => x === null || typeof x !== 'object')) {           // listes simples : ajouts et retraits des deux côtés
      const bs = new Set(Array.isArray(b) ? b : []), ls = new Set(l), rs = new Set(r);
      const out = l.filter(x => rs.has(x) || !bs.has(x));
      for (const x of r) if (!ls.has(x) && !bs.has(x)) out.push(x);
      return out;
    }
  }
  return prefL ? l : r;                                                            // même valeur changée des deux côtés : la plus récente gagne

/* Accès à GitHub */
async function gh(cfg, chemin, opts) {
  opts = opts || {};
  const h = { Authorization: 'Bearer ' + cfg.token, Accept: opts.accept || 'application/vnd.github+json' };
  if (opts.body) h['Content-Type'] = 'application/json';

const cheminFichier = cfg => `/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${SYNC_FICHIER}`;
function erreurGh(st) {
  const e = new Error(st === 401 ? 'La clé d’accès est refusée (expirée ou mal copiée).' : st === 403 ? 'GitHub refuse l’accès (droits de la clé, ou trop de demandes : réessayez plus tard).' : st === 404 ? 'Dépôt introuvable, ou la clé n’y a pas accès.' : 'GitHub a répondu une erreur (' + st + ').');
  e.statut = st; return e;
}
async function lireDistant(cfg) {
  const r = await gh(cfg, cheminFichier(cfg));
  if (r.status === 404) return { doc: null, sha: null };
  if (!r.ok) throw erreurGh(r.status);
  const j = await r.json();
  let txt;
  if (j.content && j.encoding === 'base64') txt = deB64(j.content);
  else { const r2 = await gh(cfg, cheminFichier(cfg), { accept: 'application/vnd.github.raw+json' }); if (!r2.ok) throw erreurGh(r2.status); txt = await r2.text(); }
  return { doc: JSON.parse(txt), sha: j.sha };
}
async function ecrireDistant(cfg, doc, sha) {
  const body = { message: 'Popote : mise à jour depuis ' + (cfg.appareil || 'un appareil'), content: enB64(JSON.stringify(doc)) };
  if (sha) body.sha = sha;
  const r = await gh(cfg, cheminFichier(cfg), { method: 'PUT', body });
  if (r.status === 409 || r.status === 422) { const e = new Error('conflit'); e.conflit = true; throw e; }
  if (!r.ok) throw erreurGh(r.status);
  return (await r.json()).content.sha;
}

/* ---------- Suggestions sous les cases « aliment » et « recette » ----------
   La liste intégrée au navigateur est absente ou capricieuse sur iPad et iPhone :
   on affiche nos propres boutons, avec « Créer l'aliment » quand il n'existe pas. */
function candidatsAliments(q) {
  const n = norm(q); if (!n) return [];
  const l = [];
  for (const a of Object.values(ING)) {
    const t = norm(a.nom);
    const sc = t === n ? 0 : t.startsWith(n) ? 1 : t.split(/[\s\-’'(),]+/).some(m => m.startsWith(n)) ? 2 : t.includes(n) ? 3 : -1;
    if (sc >= 0) l.push([sc, a]);
  }
  return l.sort((x, y) => x[0] - y[0] || x[1].nom.localeCompare(y[1].nom, 'fr')).map(x => x[1]);
}
function candidatsRecettes(q) {
  const n = norm(q); if (!n) return [];
  return toutesRecettes().filter(r => norm(r.nom).includes(n)).sort((a, b) => norm(a.nom).indexOf(n) - norm(b.nom).indexOf(n) || a.nom.localeCompare(b.nom, 'fr'));
}
function majSuggestions(el) {
  let box = el._ac;
  if (!box || !box.isConnected) {
    box = document.createElement('div'); box.className = 'ac-liste'; box._input = el; el._ac = box;
    const p = el.parentNode;
    if (/\b(ing-ligne|grille2|grille3)\b/.test(p.className)) p.parentNode.insertBefore(box, p.nextSibling); // sous la ligne
    else p.insertBefore(box, el);                                                                           // au-dessus de la case (visible avec le clavier)
  }
  const q = el.value.trim();
  if (!q || el._acChoisi === el.value) { box.hidden = true; box.innerHTML = ''; return; }
  el._acChoisi = null;
  const fete = el.dataset.ac === 'rec', c = fete ? candidatsRecettes(q) : candidatsAliments(q);
  const exact = c.some(x => norm(x.nom) === norm(q));
  let h = c.slice(0, 8).map(x => `<button type="button" class="ac-item" data-a="acChoisir" data-nom="${esc(x.nom)}">${esc(x.nom)}</button>`).join('');
  if (c.length > 8) h += `<div class="ac-plus">… et ${c.length - 8} autres : tapez quelques lettres de plus.</div>`;
  if (!fete && el.dataset.acTous && !exact && c.length > 1 && c.length <= 6) h += `<button type="button" class="ac-item ac-tous" data-a="acTous">Tous ces aliments (${c.length})</button>`;
  if (!fete && !exact) h += `<button type="button" class="ac-item ac-creer" data-a="acCreer" data-nom="${esc(q)}">＋ Créer l’aliment « ${esc(cap(q))} »</button>`;
  if (fete && !c.length) h = '<div class="ac-plus">Aucune recette de ce nom.</div>';
  box.innerHTML = h; box.hidden = !h;
}
const selecteurDe = el => el.id ? '#' + el.id : ['c', 'i', 'p', 'k'].filter(k => el.dataset[k] !== undefined).map(k => `[data-${k}="${el.dataset[k]}"]`).join('');
Object.assign(A, {
  acChoisir: el => {
    const box = el.closest('.ac-liste'), inp = box && box._input; if (!inp) return;
    inp.value = el.dataset.nom; inp._acChoisi = inp.value; box.hidden = true; box.innerHTML = '';
    inp.dispatchEvent(new Event('input', { bubbles: true })); inp.dispatchEvent(new Event('change', { bubbles: true }));
  },
  acTous: el => { // « n'aime pas » : tous les aliments correspondants d'un coup (ex. céleri branche et céleri-rave)
    const inp = el.closest('.ac-liste')._input, p = personne(inp.dataset.p), l = candidatsAliments(inp.value);
    p.naime = p.naime || []; for (const a of l) if (!p.naime.includes(a.id)) p.naime.push(a.id);
    sauver(); rendre(); toast(`${p.nom} n’aime pas : ${l.map(a => a.nom.toLowerCase()).join(', ')}.`);
  },
  acCreer: el => {
    const inp = el.closest('.ac-liste')._input; UI.acSel = selecteurDe(inp);

    ouvrir(modaleAliment);

});

/* ---------- Démarrage ---------- */
function demarrer() {

  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-a]'); if (!el) return;
    if (ev.target.id === 'voile') return;

  });

  document.addEventListener('change', ev => { const el = ev.target; if (!el.dataset) return; if (el.dataset.c && C[el.dataset.c]) C[el.dataset.c](el); else if (el.dataset.i && I[el.dataset.i] && (el.tagName === 'SELECT' || el.type === 'date')) I[el.dataset.i](el); });
  document.addEventListener('input', ev => { const el = ev.target; if (el.dataset && el.dataset.i && I[el.dataset.i]) I[el.dataset.i](el); if (el.dataset && el.dataset.ac && el.isConnected) majSuggestions(el); });
  document.addEventListener('focusin', ev => { const el = ev.target; if (el.dataset && el.dataset.ac && el.value.trim()) majSuggestions(el); });

        <div class="actions fin"><button class="btn del" data-a="annulerImport">Revenir aux données d’avant le dernier import</button><button class="btn" data-a="fermer">Annuler</button></div>`);
    };

  document.addEventListener('visibilitychange', () => { if (!document.hidden) synchroniser(); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    try { navigator.serviceWorker.register('sw.js').catch(() => { }); } catch (e) { }
  }
}
